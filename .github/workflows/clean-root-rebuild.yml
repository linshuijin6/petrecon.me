name: One-time clean root rebuild

on:
  push:
    branches:
      - v1.1-visual-evidence

permissions:
  contents: write

jobs:
  rebuild:
    if: contains(github.event.head_commit.message, '[clean-root]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1.1
        uses: actions/checkout@v5
        with:
          ref: v1.1-visual-evidence
          fetch-depth: 1

      - name: Configure identity and validate source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test ! -e public/cv/shuijin-lin-cv.pdf
          npm install --no-package-lock
          npm run build

      - name: Create clean v1.1 root
        run: |
          git checkout --orphan clean-v11
          git reset
          git add -A
          git commit -m "v1.1: visual evidence portfolio"

      - name: Create clean main root without purge workflows
        run: |
          git checkout --orphan clean-main
          git reset
          rm -f .github/workflows/purge-cv-history.yml
          rm -f .github/workflows/purge-cv-history-v3.yml
          rm -f .github/workflows/clean-root-rebuild.yml
          rm -rf dist node_modules
          git add -A
          git commit -m "v1.1: visual evidence portfolio"

      - name: Verify clean main history
        run: |
          if git rev-list clean-main --objects | grep -F "public/cv/shuijin-lin-cv.pdf"; then
            echo "CV path found in clean main history."
            exit 1
          fi
          test ! -e .github/workflows/purge-cv-history.yml
          test ! -e .github/workflows/purge-cv-history-v3.yml
          test ! -e .github/workflows/clean-root-rebuild.yml

      - name: Force-push clean roots
        run: |
          git push --force origin clean-main:main
          git push --force origin clean-v11:v1.1-visual-evidence
